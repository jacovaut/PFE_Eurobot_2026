teleop_twist_joy:
  ros__parameters:

    # enable button (must be held)
    enable_button: 5   # R1 (example)

    # linear velocity (left stick)
    axis_linear:
      x: 1   # forward/back
      y: 0   # strafe (if mecanum)

    scale_linear:
      x: 1.0
      y: 1.0

    # angular velocity (right stick)
    axis_angular:
      yaw: 3   # right stick left/right

    scale_angular:
      yaw: 1.5