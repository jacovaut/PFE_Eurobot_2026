global_localization_node:
  ros__parameters:
    # Shared launch defaults
    use_cluster_pipeline: true

    # Camera and detection settings
    camera_path: "/dev/v4l/by-id/usb-HD_USB_Camera_HD_USB_Camera_01.00.00-video-index0" # Primary (stable) camera selector
    camera_index: 0 # Fallback only if camera_path is empty
    width: 3840
    height: 2160
    fps: 15
    fourcc: "MJPG"
    camera_gain: 255
    camera_gamma: 64
    camera_backlight_compensation: 27
    camera_autofocus: 0
    camera_focus_absolute: 0
    camera_exposure_time_absolute: 200

    # CLAHE preprocessing on every frame (before main ArUco detection)
    # DISABLED: CLAHE(3,16) kills small robot marker detection (26% vs 100% without).
    # Table markers are handled by the rescue pass which already uses CLAHE.
    enable_clahe_preprocessing: false
    clahe_clip_limit: 3.0
    clahe_tile_size: 16
    # Calibration file defaults to the installed pfe package share path.
    # Override calibration_file at launch only when testing a different calibration.
    debug_view: true

    # Frames / topics
    map_frame: "map"
    pose_topic: "/camera/global_pose"
    detected_blocks_topic: "/detected_blocks"

    # Marker setup
    robot_marker_id: 1
    enemy_robot_marker_id: 6
    table_marker_length_m: 0.10
    robot_marker_length_m: 0.07
    enemy_robot_marker_length_m: 0.07
    enemy_robot_size_x_m: 0.40
    enemy_robot_size_y_m: 0.30
    enemy_robot_obstacle_z_m: 0.05
    block_marker_length_m: 0.03
    block_marker_ids: [36, 47, 41]
    block_marker_colors: ["bleu", "jaune", "black"]
    block_size_x_m: 0.15
    block_size_y_m: 0.05
    block_center_z_m: 0.03
    min_table_markers: 1

    # ArUco detector tuning (important for large table markers IDs 20-23)
    detector_perspective_remove_pixel_per_cell: 10
    detector_adaptive_thresh_win_size_min: 3
    detector_adaptive_thresh_win_size_max: 101
    detector_adaptive_thresh_win_size_step: 10
    detector_adaptive_thresh_constant: 7.0
    detector_min_marker_perimeter_rate: 0.005
    detector_max_marker_perimeter_rate: 4.0
    detector_error_correction_rate: 0.45
    detector_use_corner_refinement_subpix: true

    # 2nd pass for hard large table markers (adds missing IDs only)
    enable_table_marker_rescue_pass: true
    rescue_clahe_clip_limit: 3.0
    rescue_adaptive_thresh_win_size_max: 181
    rescue_adaptive_thresh_win_size_step: 30
    rescue_min_marker_perimeter_rate: 0.015
    rescue_error_correction_rate: 0.6

    # 3rd pass for block markers near frame borders (IDs 36/47)
    enable_block_marker_border_rescue_pass: true
    block_rescue_pad_ratio: 0.02
    block_rescue_clahe_clip_limit: 2.0
    block_rescue_adaptive_thresh_win_size_max: 200
    block_rescue_adaptive_thresh_win_size_step: 30
    block_rescue_min_marker_perimeter_rate: 0.003
    block_rescue_error_correction_rate: 0.8
    block_rescue_min_distance_to_border: 0

    # 4th pass: bird's-eye-view rescue (requires valid camera pose)
    # Warps image to a top-down table view to eliminate perspective distortion
    # at borders. BEV scale: 1000 px/m = 1px per mm (3cm marker = 30px).
    enable_bev_block_rescue_pass: true
    bev_block_rescue_scale_px_per_m: 1000.0

    # Snapshot-based pose stabilization
    pose_update_interval_s: 0.1
    block_rescue_period_s: 0.5
    bev_block_rescue_period_s: 1.0

    # EMA tracking for /detected_blocks JSON before obstacle/strategy conversion.
    enable_entity_tracking: true
    entity_tracking_match_gate_m: 0.12
    entity_tracking_ema_alpha: 0.5
    entity_tracking_yaw_alpha: 0.5
    entity_tracking_max_missed_frames: 5

    # base_link -> robot ArUco transform, measured on the robot.
    # X is forward from base_link, Y is left, Z is up, yaw is radians.
    # Example: if the marker center is 12 cm forward and 4 cm left of base_link, use x=0.12, y=0.04.
    base_link_to_aruco_x: 0.0
    base_link_to_aruco_y: 0.0
    base_link_to_aruco_z: 0.0
    base_link_to_aruco_yaw: 0.0

external_perception_node:
  ros__parameters:
    camera_path: "/dev/v4l/by-id/usb-HD_USB_Camera_HD_USB_Camera_01.00.00-video-index0"
    camera_index: 0
    width: 3840
    height: 2160
    fps: 15
    fourcc: "MJPG"
    debug_view: true
    # Measurement covariance
    position_variance_x: 0.01
    position_variance_y: 0.01
    yaw_variance: 0.08

    # -----------------------------
    # World map (table marker poses in map frame)
    # -----------------------------
    # Keep arrays aligned by index.
    # Example: marker id table_marker_ids[i] is at
    # (x, y, z, yaw) = (table_marker_x_m[i], table_marker_y_m[i], table_marker_z_m[i], table_marker_yaw_rad[i]).
    table_marker_ids: [20, 21, 22, 23]
    table_marker_x_m: [0.6, 2.4, 0.6, 2.4]
    table_marker_y_m: [1.4, 1.4, 0.6, 0.6]
    table_marker_z_m: [0.0, 0.0, 0.0, 0.0]
    table_marker_yaw_rad: [0.0, 0.0, 0.0, 0.0]

    # -----------------------------
    # Zones de score (fixes, map frame)
    # -----------------------------
    # Nids (zones d'equipe), dimensions: 600 x 450 mm
    nids_noms: ["nid_jaune", "nid_bleu"]
    nids_centre_x_m: [0.300, 2.700]
    nids_centre_y_m: [1.775, 1.775]
    nids_taille_x_m: [0.600, 0.600]
    nids_taille_y_m: [0.450, 0.450]

    # Garde-manger (zones communes), dimensions: 200 x 200 mm
    # Numbering follows table columns left-to-right, each column bottom-to-top.
    garde_manger_noms: [
      "garde_manger_1", "garde_manger_2", "garde_manger_3", "garde_manger_4",
      "garde_manger_5", "garde_manger_6", "garde_manger_7", "garde_manger_8"
    ]
    garde_manger_centre_x_m: [1.250, 1.750, 0.800, 1.500, 2.200, 0.700, 1.500, 2.300]
    garde_manger_centre_y_m: [1.450, 1.450, 0.800, 0.800, 0.800, 0.100, 0.100, 0.100]
    garde_manger_taille_x_m: [0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200]
    garde_manger_taille_y_m: [0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200]

    # Zones interdites pour la navigation, dimensions: 1800 x 450 mm
    zones_interdites_noms: ["grenier"]
    zones_interdites_centre_x_m: [1.500]
    zones_interdites_centre_y_m: [1.775]
    zones_interdites_taille_x_m: [1.800]
    zones_interdites_taille_y_m: [0.450]

camera_map_visualizer_node:
  ros__parameters:
    publish_period_s: 0.10
    dynamic_obstacle_stale_timeout_s: 0.75
    dynamic_obstacle_max_miss_count: 10
    stamp_obstacle_cloud_with_now: true
    detected_obstacle_point_spacing_m: 0.04
    detected_obstacle_padding_m: 0.0
    enemy_robot_obstacle_padding_m: 0.0
    static_pointcloud_topic: "/camera/static_obstacles"
    enemy_pointcloud_topic: "/camera/enemy_obstacles"
    dynamic_obstacle_grid_topic: "/camera/block_obstacle_grid"
    dynamic_obstacle_grid_resolution_m: 0.01
    static_obstacle_padding_m: 0.0
    arena_wall_spacing_m: 0.02
    publish_arena_walls_as_obstacles: false

    nids_noms: ["nid_jaune", "nid_bleu"]
    nids_centre_x_m: [0.300, 2.700]
    nids_centre_y_m: [1.775, 1.775]
    nids_taille_x_m: [0.600, 0.600]
    nids_taille_y_m: [0.450, 0.450]

    garde_manger_noms: [
      "garde_manger_1", "garde_manger_2", "garde_manger_3", "garde_manger_4",
      "garde_manger_5", "garde_manger_6", "garde_manger_7", "garde_manger_8"
    ]
    garde_manger_centre_x_m: [1.250, 1.750, 0.800, 1.500, 2.200, 0.700, 1.500, 2.300]
    garde_manger_centre_y_m: [1.450, 1.450, 0.800, 0.800, 0.800, 0.100, 0.100, 0.100]
    garde_manger_taille_x_m: [0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200]
    garde_manger_taille_y_m: [0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200, 0.200]

    zones_interdites_noms: ["grenier"]
    zones_interdites_centre_x_m: [1.500]
    zones_interdites_centre_y_m: [1.775]
    zones_interdites_taille_x_m: [1.800]
    zones_interdites_taille_y_m: [0.450]
