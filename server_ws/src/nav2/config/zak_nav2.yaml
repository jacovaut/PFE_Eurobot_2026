# https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html
waypoint_follower:
  ros__parameters:
    use_sim_time: false                                   # whether to use simulation time or not.
    loop_rate: 20                                         # Rate to check for results from current navigation task.
    # global_frame_id: map                                # The global frame id for the robot.
    stop_on_failure: false                                # Whether to fail action task if a single waypoint fails. If false, will continue to next waypoint.
    # action_server_result_timeout: 900.0                 # The timeout value (in seconds) for action servers to discard a goal handle if a result has not been produced.
    # bond_heartbeat_period: 0.1                          # The lifecycle node bond mechanism publishing period (on the /bond topic).
    service_introspection_mode: "disabled"                # The introspection mode for services. Options are “disabled”, “metadata”, “contents”.
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: False                                       # Whether waypoint_task_executor plugin is enabled.
      waypoint_pause_duration: 0                          # Amount of time in milliseconds, for robot to sleep/wait after each waypoint is reached. If zero, robot will directly continue to next waypoint.

# https://docs.nav2.org/configuration/packages/configuring-velocity-smoother.html
# TODO: add "CLOSED_LOOP" option to use odometry feedback.
velocity_smoother:
  ros__parameters:
    use_sim_time: false                     # whether to use simulation time or not.
    use_realtime_priority: false            # This will set the controller’s execution thread to a higher priority than the rest of the system (90) to meet scheduling deadlines to have less missed loop rates.
    smoothing_frequency: 20.0               # Frequency (Hz) to use the last received velocity command to smooth by velocity, acceleration, and deadband constraints. 
    velocity_timeout: 1.0                   # Timeout (s) after which the velocity smoother will send a zero-ed out Twist command and stop publishing.
    max_velocity: [0.5, 0.5, 1.00]        # Maximum velocities (m/s) in [x, y, theta] axes.
    min_velocity: [-0.5, -0.5, -1.00]     # Minimum velocities (m/s) in [x, y, theta] axes.
    deadband_velocity: [0.01, 0.01, 0.03]   # Minimum velocities (m/s) to send to the robot hardware controllers, to prevent small commands from damaging hardware controllers if that speed cannot be achieved due to stall torque.
    scale_velocities: False                 # Whether or not to adjust other components of velocity proportionally to a component’s required changes due to acceleration limits. 
    max_accel: [0.5, 0.5, 1.00]           # Maximum acceleration to apply to each axis [x, y, theta].
    max_decel: [-1.0, -1.0, -2.00]        # Maximum deceleration to apply to each axis [x, y, theta].  
    feedback: "OPEN_LOOP"                   # TODO: add "CLOSED_LOOP" option to use odometry feedback.
    odom_topic: "odom"                      # Topic to find robot odometry, if in CLOSED_LOOP operational mode.
    odom_duration: 0.2                      # Time (s) to buffer odometry commands to estimate the robot speed, if in CLOSED_LOOP operational mode.
    enable_stamped_cmd_vel: true            # Whether to use geometry_msgs::msg::Twist or geometry_msgs::msg::TwistStamped velocity data. True uses TwistStamped, false uses Twist. 
    bond_heartbeat_period: 0.1              # The lifecycle node bond mechanism publishing period (on the /bond topic). Disabled if inferior or equal to 0.0.

