amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.25
    source_timeout: 0.75
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons: ["EnemyStop", "EnemySlow"]
    EnemyStop:
      type: "polygon"
      points: "[[0.32, 0.22], [0.32, -0.22], [-0.32, -0.22], [-0.32, 0.22]]"
      action_type: "stop"
      min_points: 1
      visualize: true
      polygon_pub_topic: "enemy_stop_polygon"
      enabled: true
    EnemySlow:
      type: "polygon"
      points: "[[0.55, 0.36], [0.55, -0.36], [-0.55, -0.36], [-0.55, 0.36]]"
      action_type: "slowdown"
      min_points: 1
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: "enemy_slow_polygon"
      enabled: true
    observation_sources: ["enemy"]
    enemy:
      type: "pointcloud"
      topic: "/camera/enemy_obstacles"
      min_height: 0.0
      max_height: 1.0
      enabled: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euclidean: 1.0
      w_traversal_cost: 8.0 # MAY NEED TUNING was 3.0 before
      w_heuristic_param: 1.0

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.2

    # Tell Nav2 which odom to use (use EKF output)
    odom_topic: "/odometry/local"

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.01
      movement_time_allowance: 3.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.52

    # Holonomic mecanum controller. Use DWB directly so the robot can strafe
    # instead of rotating to face the path before moving.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      # Holonomic mecanum: allow y velocity
      min_vel_x: -0.5
      max_vel_x:  0.5
      min_vel_y: -0.5
      max_vel_y:  0.5
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 0.6
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.5

      vx_samples: 8
      vy_samples: 8
      vtheta_samples: 20
      sim_time: 0.9
      linear_granularity: 0.05
      angular_granularity: 0.03

      transform_tolerance: 0.5
      trans_stopped_velocity: 0.05

      critics: ["ObstacleFootprint", "BaseObstacle", "PathAlign", "GoalAlign", "PathDist", "GoalDist", "Oscillation", "Twirling"]
      ObstacleFootprint.scale: 32.0
      BaseObstacle.scale: 16.0
      PathAlign.scale: 0.0
      GoalAlign.scale: 0.0
      PathDist.scale: 2.0
      GoalDist.scale: 8.0
      Oscillation.scale: 1.0
      Twirling.scale: 8.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odometry/local"
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2)/config/navigate_to_pose_with_backup.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait", "spin"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    spin:
      plugin: "nav2_behaviors::Spin"

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.35]
    min_velocity: [-0.5, -0.5, -0.35]
    max_accel: [1.0, 1.0, 0.6]
    max_decel: [-1.0, -1.0, -0.6]
    odom_topic: "/odometry/local"
    velocity_timeout: 0.5

# --- Global costmap params (used by multiple nodes) ---
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 8.0
      publish_frequency: 2.0
      resolution: 0.01
      rolling_window: false
      transform_tolerance: 0.5
      footprint: "[[-0.200, -0.150], [-0.200, 0.150], [0.200, 0.150], [0.200, -0.150]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "static_obstacle_layer", "dynamic_obstacle_layer", "enemy_obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: false
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      static_obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: false
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: static_camera
        static_camera:
          topic: "/camera/static_obstacles"
          sensor_frame: map
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          observation_persistence: 2.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      dynamic_obstacle_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/camera/block_obstacle_grid"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        track_unknown_space: false
        use_maximum: true
        trinary_costmap: false
        lethal_cost_threshold: 65
      enemy_obstacle_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/camera/enemy_obstacle_grid"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        track_unknown_space: false
        use_maximum: true
        trinary_costmap: false
        lethal_cost_threshold: 101
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        cost_scaling_factor: 20.0

# --- Local costmap params ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      resolution: 0.01
      rolling_window: true
      width: 3
      height: 3
      transform_tolerance: 0.5
      footprint: "[[-0.200, -0.150], [-0.200, 0.150], [0.200, 0.150], [0.200, -0.150]]"
      footprint_padding: 0.02
      plugins: ["static_obstacle_layer", "dynamic_obstacle_layer", "enemy_obstacle_layer", "inflation_layer"]
      static_obstacle_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: false
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: static_camera
        static_camera:
          topic: "/camera/block_obstacles"
          sensor_frame: map
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          observation_persistence: 2.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      dynamic_obstacle_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/camera/block_obstacle_grid"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        track_unknown_space: false
        use_maximum: true
        trinary_costmap: false
        lethal_cost_threshold: 65
      enemy_obstacle_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/camera/enemy_obstacle_grid"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        track_unknown_space: false
        use_maximum: true
        trinary_costmap: false
        lethal_cost_threshold: 101
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.25
        cost_scaling_factor: 20.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - behavior_server
      - velocity_smoother
      - collision_monitor
      - bt_navigator
      - waypoint_follower
