amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false

collision_monitor:
  ros__parameters:
    observation_sources: []
    polygons: []
    enable_stamped_cmd_vel: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    # Planner option A (simple): NavFn
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.8

    # Tell Nav2 which odom to use (use EKF output)
    odom_topic: "/odometry/local"

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.01
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.35

    # Controller option A (recommended-to-start): DWB holonomic
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Holonomic mecanum: allow y velocity
      min_vel_x: -0.5
      max_vel_x:  0.5
      min_vel_y: -0.5
      max_vel_y:  0.5
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 0.6
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -0.6

      vx_samples: 12
      vy_samples: 12
      vtheta_samples: 10
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.03

      transform_tolerance: 0.3
      trans_stopped_velocity: 0.05

      critics: ["ObstacleFootprint", "BaseObstacle", "PathAlign", "GoalAlign", "PathDist", "GoalDist", "RotateToGoal", "Oscillation"]
      BaseObstacle.scale: 0.20
      PathAlign.scale: 0.0
      GoalAlign.scale: 0.0
      PathDist.scale: 18.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 8.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odometry/local"
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.35]
    min_velocity: [-0.5, -0.5, -0.35]
    max_accel: [1.0, 1.0, 0.6]
    max_decel: [-1.0, -1.0, -0.6]
    odom_topic: "/odometry/local"
    velocity_timeout: 0.5

# --- Global costmap params (used by multiple nodes) ---
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      rolling_window: false
      footprint: "[[-0.045, -0.264], [-0.045, 0.044], [0.469, 0.044], [0.469, -0.264]]"
      footprint_padding: 0.02
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 2.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: camera
        camera:
          topic: "/camera/block_obstacles"
          sensor_frame: map
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0  

# --- Local costmap params ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      resolution: 0.05
      rolling_window: true
      width: 4
      height: 4
      footprint: "[[-0.045, -0.264], [-0.045, 0.044], [0.469, 0.044], [0.469, -0.264]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 2.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: "/scan"
          sensor_frame: laser_frame
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0  
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: camera
        camera:
          topic: "/camera/block_obstacles"
          sensor_frame: map
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0    

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - bt_navigator
      - behavior_server
      - velocity_smoother
      - waypoint_follower
