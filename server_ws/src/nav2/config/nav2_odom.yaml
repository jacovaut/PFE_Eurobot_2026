amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false

#collision_monitor:
  #ros__parameters:
    #observation_sources: []
    #polygons: []
    #enable_stamped_cmd_vel: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    # Planner option A (simple): NavFn
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    # Tell Nav2 which odom to use (use EKF output)
    odom_topic: "/odometry/local"

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.20

    # Controller option A (recommended-to-start): DWB holonomic
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Holonomic mecanum: allow y velocity
      min_vel_x: -0.4
      max_vel_x:  0.4
      min_vel_y: -0.4
      max_vel_y:  0.4
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.6
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 0.8
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -0.8

      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.3

      critics: ["PathAlign", "GoalAlign", "PathDist", "GoalDist", "RotateToGoal", "Oscillation"]
      PathAlign.scale: 12.0
      GoalAlign.scale: 8.0
      PathDist.scale: 32.0
      GoalDist.scale: 32.0
      RotateToGoal.scale: 8.0
      RotateToGoal.slowing_factor: 8.0
      RotateToGoal.lookahead_time: 0.5
      Oscillation.scale: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: "/odometry/local"
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2)/config/navigate_to_pose_no_recovery.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2)/config/navigate_through_poses_w_replanning_no_recovery.xml"
    plugin_lib_names: ["match_nav2_wait_for_match_bt_node"]
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.4, 0.3]
    min_velocity: [-0.4, -0.4, -0.3]
    max_accel: [1.0, 1.0, 0.8]
    max_decel: [-1.0, -1.0, -0.8]
    odom_topic: "/odometry/local"
    velocity_timeout: 0.5

# --- Global costmap params (used by multiple nodes) ---
global_costmap:
# This nested block is what planner_server is currently using (note the logger: global_costmap.global_costmap)
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      rolling_window: true
      width: 200
      height: 200
      footprint: "[[-0.257, -0.154], [-0.257, 0.154], [0.257, 0.154], [0.257, -0.154]]"
      footprint_padding: 0.02
      plugins: ["lidar_obstacle_layer", "inflation_layer"]
      lidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: lidar_cloud
        lidar_cloud:
          topic: "/scan_cloud"
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: -0.10
          max_obstacle_height: 0.30
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

# --- Local costmap params ---
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      resolution: 0.05
      rolling_window: true
      width: 80
      height: 80
      footprint: "[[-0.257, -0.154], [-0.257, 0.154], [0.257, 0.154], [0.257, -0.154]]"
      footprint_padding: 0.02
      plugins: ["lidar_obstacle_layer", "inflation_layer"]
      lidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: lidar_cloud
        lidar_cloud:
          topic: "/scan_cloud"
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: -0.10
          max_obstacle_height: 0.30
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server
      - velocity_smoother
