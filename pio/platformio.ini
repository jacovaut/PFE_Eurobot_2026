[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_microros_distro = jazzy
board_microros_transport = wifi
upload_speed = 115200
upload_protocol = esptool
; upload_command = ~/.local/bin/esptool --chip esp32 --port $UPLOAD_PORT --baud $UPLOAD_SPEED write_flash -z 0x10000 $SOURCE
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git

[env:test_pub]
build_src_filter = +<${PIOENV}/*>

[env:entrainement]
build_src_filter = +<${PIOENV}/*>
build_flags = -D MICROROS_TRANSPORT_ARDUINO_WIFI
lib_deps = 
    ${env.lib_deps}
    gin66/FastAccelStepper
    https://github.com/pololu/high-power-stepper-driver-arduino
    https://github.com/madhephaestus/ESP32Encoder.git

[env:driver]
build_src_filter = +<${PIOENV}/*>
lib_deps = 
    ${env.lib_deps}
    gin66/FastAccelStepper
    https://github.com/pololu/high-power-stepper-driver-arduino

[env:deadwheels]
build_src_filter = +<${PIOENV}/*>/
lib_deps =
    ${env.lib_deps}
    https://github.com/madhephaestus/ESP32Encoder.git

[env:manipulation]
build_src_filter = +<${PIOENV}/*>
lib_deps =
    ${env.lib_deps}
    https://github.com/madhephaestus/ESP32Encoder.git
    madhephaestus/ESP32Servo

[env:Pami_Ninja]
build_src_filter = +<Pami_Ninja/*>
build_flags =
    -D MICROROS_TRANSPORT_ARDUINO_WIFI
    ; Default prompts on Serial Monitor for S/R mode selection.
    ; Force serial keyboard only, without connecting to the micro-ROS agent:
    ; -D PAMI_CONTROL_METHOD=PAMI_CONTROL_SERIAL
    ; Force ROS / micro-ROS WiFi without prompting:
    ; -D PAMI_CONTROL_METHOD=PAMI_CONTROL_ROS
board_microros_transport = wifi
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Encoder
    madhephaestus/ESP32Servo

[env:encoder_test]
build_src_filter = +<${PIOENV}/*>

[env:manipulation_test]
build_src_filter = +<${PIOENV}/*>
lib_deps =
    https://github.com/madhephaestus/ESP32Encoder.git
    madhephaestus/ESP32Servo

[env:PID_test]
build_src_filter = +<${PIOENV}/*>
lib_deps =
    https://github.com/madhephaestus/ESP32Encoder.git
